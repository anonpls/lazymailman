<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Вход — Lazy Mailman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="login-modal">
    <form id="login-form">
      <span class="brand-mark">✦</span>
      <h2>Вход</h2>
      <p>Введите пароль администратора сервиса.</p>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="Пароль" required autofocus />
      <button class="send-button" type="submit">Войти</button>
      <small id="login-error"></small>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
